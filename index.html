<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>きょうの よてい</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #fdfbf5; color: #1e293b; margin: 0; padding: 16px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  h1 { font-size: 1.4rem; margin: 0; }
  button { font-size: 1rem; padding: 10px 14px; border-radius: 10px; border: 2px solid #cbd5e1; background: #fff; font-weight: bold; }
  .card { display: flex; align-items: center; gap: 12px; background: #fff; border: 3px solid #cbd5e1; border-radius: 16px; padding: 14px; margin-bottom: 12px; }
  .card.active { border-color: #f59e0b; background: #fffbeb; }
  .card.done { background: #f1f5f9; border-color: #94a3b8; opacity: 0.65; }
  .card.done .title { text-decoration: line-through; }
  .icon { font-size: 2rem; width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border-radius: 10px; background: #f8fafc; overflow: hidden; flex-shrink: 0; }
  .icon img { width: 100%; height: 100%; object-fit: cover; }
  .title { font-size: 1.3rem; font-weight: bold; flex: 1; }
  .stamp { color: #16a34a; font-weight: bold; font-size: 1.1rem; }
  .timer-box { background: #e0f2fe; padding: 12px; border-radius: 12px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  #timer-text { font-size: 1.5rem; font-weight: bold; }
  #edit-area { display: none; background: #fff; border: 2px solid #94a3b8; border-radius: 12px; padding: 14px; margin-bottom: 16px; }
  input[type="text"] { font-size: 1rem; padding: 8px; width: 65%; border: 2px solid #cbd5e1; border-radius: 8px; }
</style>
</head>
<body>
  <header>
    <h1>📅 きょうの よてい</h1>
    <div>
      <button onclick="resetAll()">🔄 リセット</button>
      <button onclick="toggleEdit()">⚙️ せんせい</button>
    </div>
  </header>

  <div class="timer-box">
    <span id="timer-text">⏱ 03:00</span>
    <div>
      <button onclick="startTimer()">スタート</button>
      <button onclick="resetTimer()">もどす</button>
    </div>
  </div>

  <div id="edit-area">
    <p style="margin-top:0;font-weight:bold;">＋ てじゅんを ついか（写真もOK）</p>
    <input type="text" id="new-title" placeholder="れい：さかなつり">
    <button onclick="addItem()">ついか</button>
    <div style="margin-top:8px;"><input type="file" id="new-img" accept="image/*"></div>
  </div>

  <div id="list"></div>

<script>
  const KEY = 'schedule_test_v1';
  let items = JSON.parse(localStorage.getItem(KEY)) || [
    { title: 'はじまり・あいさつ', icon: '👋', done: false },
    { title: 'さかなつり', icon: '🎣', done: false },
    { title: 'ふりかえり・おわり', icon: '💮', done: false }
  ];
  let sec = 180, tid = null;

  function save() { localStorage.setItem(KEY, JSON.stringify(items)); }
  function speak(text) {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ja-JP';
    speechSynthesis.speak(u);
  }
  function render() {
    const el = document.getElementById('list');
    el.innerHTML = '';
    const nextIdx = items.findIndex(i => !i.done);
    items.forEach((item, idx) => {
      const div = document.createElement('div');
      div.className = 'card' + (item.done ? ' done' : (idx === nextIdx ? ' active' : ''));
      div.onclick = () => { item.done = !item.done; save(); render(); if (item.done) speak(item.title + '、おわり！'); };
      const iconHtml = item.img ? `<img src="${item.img}">` : (item.icon || '⭐');
      div.innerHTML = `<div class="icon">${iconHtml}</div><div class="title">${item.title}</div>` +
        (item.done ? '<span class="stamp">💮おわり</span>' : `<button onclick="event.stopPropagation();speak('${item.title}')">🔊</button>`);
      el.appendChild(div);
    });
  }
  function resetAll() { items.forEach(i => i.done = false); save(); render(); }
  function toggleEdit() { const e = document.getElementById('edit-area'); e.style.display = e.style.display === 'block' ? 'none' : 'block'; }
  function addItem() {
    const t = document.getElementById('new-title').value.trim();
    if (!t) return;
    const f = document.getElementById('new-img').files[0];
    if (f) {
      const r = new FileReader();
      r.onload = () => { items.push({ title: t, img: r.result, done: false }); save(); render(); };
      r.readAsDataURL(f);
    } else {
      items.push({ title: t, icon: '⭐', done: false }); save(); render();
    }
    document.getElementById('new-title').value = '';
    document.getElementById('new-img').value = '';
  }
  function updateTimer() {
    const m = String(Math.floor(sec / 60)).padStart(2, '0');
    const s = String(sec % 60).padStart(2, '0');
    document.getElementById('timer-text').textContent = `⏱ ${m}:${s}`;
  }
  function startTimer() {
    if (tid) { clearInterval(tid); tid = null; return; }
    tid = setInterval(() => {
      if (sec > 0) { sec--; updateTimer(); }
      else { clearInterval(tid); tid = null; speak('じかんになりました'); }
    }, 1000);
  }
  function resetTimer() { clearInterval(tid); tid = null; sec = 180; updateTimer(); }
  render();
</script>
</body>
</html>
